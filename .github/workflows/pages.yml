name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer les pages
        run: node outils/construire.mjs

      - name: Assembler le site (pages publiques seulement)
        run: |
          mkdir _site
          touch _site/.nojekyll
          cp index.html 404.html robots.txt sitemap.xml _site/
          cp -r assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -d images ]; then cp -r images _site/; fi
          # Chaque dossier contenant une page générée (projets, à propos, redirections).
          for dossier in */; do
            if [ "$dossier" != "_site/" ] && [ -f "${dossier}index.html" ]; then
              cp -r "$dossier" _site/
            fi
          done
          ls _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
